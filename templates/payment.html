{% extends 'base.html' %}
{% block title %}Payment{% endblock %}
{% block contents %}
<div class="container mt-5 p-5 text-center" style="max-width: 500px;">
    <div class="card shadow mt-5 p-4 rounded-4">
        <h2>Scan QR Code to Pay</h2>
        <p class="text-muted">Total Amount: <strong>Rs. {{ order.total_amount }}</strong></p>
        
        <!-- Dummy QR Code image -->
        <div class="my-3">
            <img src="static/qr.jpeg/?size=200x200&data=QuickCafe-Pay-{{ order.total_amount }}" alt="Payment QR" class="img-fluid border p-2 rounded">
        </div>
        <p class="small text-secondary">Scan using eSewa, Khalti, or FonePay</p>

        <!--Payment Confirmation Form -->
         <form method="POST" action="{{ url_for('confirm_payment') }}">
            <button type="submit" class="btn btn-success w-100 py-2 mt-3 fw-bold" style="border-radius: 8px;">
                I have paid - Generate Token
            </button>
        </form>
    </div>
</div>
{% endblock %}
