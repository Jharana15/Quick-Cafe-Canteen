{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block contents %}

<style>
    /* stop the page from getting a sideways scrollbar when the hero is full-width */
    html, body { overflow-x: hidden; }

    /* "full bleed": break out of any container that base.html puts around the content */
    #carouselStacked {
        position: relative;
        width: 100vw;
        margin-left: calc(50% - 50vw);   /* pulls the left edge to the screen corner */
        margin-right: 0;
        padding: 0;
        height: 100vh;
    }
</style>

<div id="carouselStacked" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-inner h-100 position-relative">

        <div class="carousel-item active h-100">
            <!-- Full-screen background image -->
            <img src="{{ url_for('static', filename='images/fooditem.jpg') }}"
                 class="d-block w-100 h-100 m-0 p-0"
                 style="object-fit: cover; object-position: center;" alt="Food Banner">

            <!-- Dark overlay so the text is clear -->
            <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>

            <!-- Centered content -->
            <div class="position-absolute top-50 start-50 translate-middle text-center text-white px-3 w-100"
                 style="max-width: 900px; z-index: 2;">

                <p class="text-uppercase fw-bold mb-3"
                   style="font-size: clamp(0.8rem, 1.2vw, 1.1rem); letter-spacing: 3px;">
                    WELCOME TO Quick Cafe Canteen
                </p>

                <h1 class="fw-bolder mb-4"
                    style="font-size: clamp(2.2rem, 5vw, 4.5rem); font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.15; text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);">
                    Order food , check menu All from one place
                    <br>
                    Digital token generator system
                </h1>

                <a href="{{ url_for('menu') }}" class="btn btn-primary">Explore Menu</a>
            </div>
        </div>

    </div>
</div>

<script>
/* Safety net: if base.html puts the content in an off-centre wrapper, the CSS above
   can still leave a gap. This measures the real gap and removes it exactly. */
(function () {
  const hero = document.getElementById('carouselStacked');
  function fit() {
    hero.style.marginLeft = '0px';                       // reset
    const gap = hero.getBoundingClientRect().left;       // distance from screen's left edge
    hero.style.marginLeft = (-gap) + 'px';
    hero.style.width = document.documentElement.clientWidth + 'px';
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  fit();
})();
</script>

{% endblock %}
